name: Keep Streamlit Alive

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes → ping
    - cron: '0 */10 * * *' # every 10 hours → empty commit
  workflow_dispatch:        # manual run if needed

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: curl -s "https://flinders-uni-stantec.streamlit.app/?ping=true" > /dev/null

  commit:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 */10 * * *' # only run on 10h schedule
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make empty commit
        run: |
          git commit --allow-empty -m "chore: keepalive commit [skip ci]"

      - name: Push commit
        run: |
          git push

